name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Enable Chromium user-namespace sandbox on the runner
        run: |
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: pip install -e ".[dev]"
      - run: playwright install --with-deps chromium
      - run: pytest -q
      - run: ruff check . --select E4,E7,E9,F
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check app/web/static/app.js
      - run: cp .env.example .env && docker compose config --quiet
      - run: docker build -t design-intelligence-system:ci .

      - name: Smoke test Docker container
        run: |
          docker run -d --name dis-smoke -p 8000:8000 design-intelligence-system:ci
          trap 'docker logs dis-smoke; docker rm -f dis-smoke' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8000/health; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:8000/
          curl --fail http://127.0.0.1:8000/static/app.js
          curl --fail http://127.0.0.1:8000/api/v1/provider
