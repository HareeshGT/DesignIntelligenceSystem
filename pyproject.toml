[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "design-intelligence-system"
version = "0.2.0"
description = "A multi-agent design intelligence and visual quality system"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1.0", "uvicorn[standard]>=0.27,<1.0", "pydantic>=2.6,<3.0", "httpx>=0.27,<1.0", "python-dotenv>=1.0,<2.0", "playwright>=1.48,<2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.4"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["app", "app.*"]
exclude = ["tests*", "prompts*"]

[tool.setuptools.package-data]
app = ["web/static/*.html", "web/static/*.css", "web/static/*.js"]
