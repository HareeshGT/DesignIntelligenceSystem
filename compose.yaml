services:
  dis:
    build:
      context: .
      dockerfile: Dockerfile
    image: design-intelligence-system:local
    container_name: dis
    restart: unless-stopped
    security_opt:
      - seccomp:./playwright-seccomp.json
    ports:
      - "${DIS_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      PORT: "8000"
      DIS_DATABASE_PATH: /data/design_intelligence.db
    volumes:
      - dis-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  dis-data:
